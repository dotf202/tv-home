<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Built for 2016-era browsers (Chrome 49 / Opera TV): flexbox, vw sizing,
     no CSS grid, no clamp(), no aspect-ratio, no backdrop-filter, no gap, no inset. */
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; width:100%}
  body{
    font-family:Inter, "Helvetica Neue", Arial, sans-serif;
    color:#f3f6ff;
    background:#0a0e1a;
    background-image:
      radial-gradient(1200px 700px at 15% -10%, #1a2b4d 0%, rgba(26,43,77,0) 55%),
      radial-gradient(1000px 600px at 110% 10%, #241a3e 0%, rgba(36,26,62,0) 50%),
      linear-gradient(160deg, #121a2e, #0a0e1a 60%, #0d1322);
    overflow:hidden; -webkit-font-smoothing:antialiased; cursor:default;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{position:relative; height:100%; width:100%; display:flex; flex-direction:column; padding:4.6vh 4.6vw}

  header{display:flex; align-items:flex-end; justify-content:space-between}
  .greet{font-family:"Space Grotesk", Inter, sans-serif; font-weight:600; font-size:3.4vw; letter-spacing:-.02em; line-height:1}
  .greet .sub{display:block; font-family:Inter, sans-serif; font-weight:400; font-size:1.35vw; color:#9fb0cf; margin-top:.5em}
  .clock{text-align:right}
  .clock .t{font-family:"Space Grotesk", Inter, sans-serif; font-weight:600; font-size:5.4vw; line-height:.92; letter-spacing:-.02em}
  .clock .t .ap{font-size:.42em; color:#9fb0cf; margin-left:.25em; font-weight:500}
  .clock .d{color:#9fb0cf; font-size:1.35vw; margin-top:.45em; font-weight:500}

  .seclabel{font-size:1.15vw; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#64748b; margin-bottom:1.2vh}

  main{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center}
  .section{margin-top:2.6vh}

  /* flex grid (no CSS grid, no gap) -- tiles carry their own margin */
  .grid{display:flex; flex-wrap:wrap; margin:-0.9vw}
  .tile{
    position:relative; width:25%; height:12.6vw; margin:0; float:none;
    border:0.9vw solid transparent;           /* transparent border = spacing substitute */
    background-clip:padding-box;
    -webkit-background-clip:padding-box;
  }
  .tile .card{
    position:absolute; top:0.9vw; left:0.9vw; right:0.9vw; bottom:0.9vw;
    border-radius:1.3vw; overflow:hidden;
    border:1px solid #273352; background:#161f38;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:1.4vw;
    -webkit-transition:-webkit-transform .2s ease; transition:transform .2s ease;
  }
  .tile .brand{position:absolute; top:0; left:0; right:0; bottom:0}
  .tile .glow{position:absolute; top:0; left:0; right:0; bottom:0; opacity:0;
    background:radial-gradient(130% 90% at 50% 120%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%);
    -webkit-transition:opacity .2s; transition:opacity .2s}
  .tile.on .card{-webkit-transform:translateY(-0.2vw) scale(1.04); transform:translateY(-0.2vw) scale(1.04)}
  .tile.on .glow{opacity:1}
  .mono{position:relative; z-index:2; width:3.2vw; height:3.2vw; border-radius:0.7vw;
    display:flex; align-items:center; justify-content:center;
    font-family:"Space Grotesk", Inter, sans-serif; font-weight:700; font-size:1.7vw;
    background:rgba(0,0,0,.3); color:#fff}
  .name{position:relative; z-index:2; font-family:"Space Grotesk", Inter, sans-serif; font-weight:600;
    font-size:1.55vw; letter-spacing:-.01em; text-shadow:0 1px 10px rgba(0,0,0,.5)}
  .name .small{display:block; font-family:Inter, sans-serif; font-weight:400; font-size:.62em; color:rgba(255,255,255,.8); margin-top:.25em}

  /* recents row -- wider cards, horizontal */
  .row{display:flex; flex-wrap:nowrap; margin:-0.7vw}
  .row .tile{width:17vw; height:9.6vw; border-width:0.7vw}
  .row .tile .card{top:0.7vw; left:0.7vw; right:0.7vw; bottom:0.7vw}

  /* gliding highlight */
  .highlight{position:absolute; top:0; left:0; border-radius:1.5vw;
    border:0.2vw solid #fff;
    box-shadow:0 0 0 0.3vw rgba(255,255,255,.12), 0 2vw 4vw rgba(0,0,0,.7);
    pointer-events:none; z-index:4;
    -webkit-transition:-webkit-transform .24s ease, width .24s ease, height .24s ease, opacity .2s;
    transition:transform .24s ease, width .24s ease, height .24s ease, opacity .2s}

  footer{display:flex; justify-content:space-between; align-items:center; color:#64748b; font-size:1.1vw; margin-top:2vh}
  .hint span{margin-right:1.6vw}
  .kbd{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:.4vw; padding:.1em .45em; color:#9fb0cf; margin:0 .12em}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="greet"><span id="greet">Good evening</span><span class="sub">Pick something to watch</span></div>
    <div class="clock"><div class="t" id="time">--</div><div class="d" id="date">--</div></div>
  </header>
  <main>
    <div class="section" id="recentSec" style="display:none">
      <div class="seclabel">Recent</div>
      <div class="row" id="recentRow"></div>
    </div>
    <div class="section">
      <div class="seclabel" id="allLabel" style="display:none">All apps</div>
      <div class="grid" id="grid"></div>
    </div>
  </main>
  <div class="highlight" id="hl" style="opacity:0"></div>
  <footer>
    <div class="hint">
      <span><span class="kbd">&larr;</span><span class="kbd">&rarr;</span><span class="kbd">&uarr;</span><span class="kbd">&darr;</span> move</span>
      <span><span class="kbd">Enter</span> open</span>
      <span><span class="kbd">F</span> full screen</span>
    </div>
    <div id="status">Home</div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var APPS = [
    {name:"Netflix",    mono:"N",  url:"https://www.netflix.com",              grad:"linear-gradient(145deg,#b1060f,#e50914 55%,#7a0008)"},
    {name:"Disney+",    mono:"D",  url:"https://www.disneyplus.com",           grad:"linear-gradient(145deg,#1b3b8f,#0e1a52)"},
    {name:"YouTube",    mono:"Y",  url:"https://www.youtube.com/tv",           grad:"linear-gradient(145deg,#ff2a2a,#b10000)"},
    {name:"Prime Video",mono:"P",  url:"https://www.primevideo.com",           grad:"linear-gradient(145deg,#0aa8e1,#0b5c94)"},
    {name:"Max",        mono:"M",  url:"https://play.max.com",                 grad:"linear-gradient(145deg,#4b2ff0,#1f0f8c)"},
    {name:"Hulu",       mono:"h",  url:"https://www.hulu.com",                 grad:"linear-gradient(145deg,#19d27c,#0a7a46)"},
    {name:"Apple TV",   mono:"tv", url:"https://tv.apple.com",                 grad:"linear-gradient(145deg,#3a3a3c,#111113)"},
    {name:"Spotify",    mono:"S",  url:"https://open.spotify.com",             grad:"linear-gradient(145deg,#1ed760,#0c6b2e)"},
    {name:"Paramount+", mono:"P+", url:"https://www.paramountplus.com",        grad:"linear-gradient(145deg,#1f6bff,#0b2f8c)"},
    {name:"Peacock",    mono:"pk", url:"https://www.peacocktv.com/watch/home", grad:"linear-gradient(145deg,#ff6b00,#8a1b6e 70%,#0f0f2e)"},
    {name:"Plex",       mono:"px", url:"https://app.plex.tv/desktop",          grad:"linear-gradient(145deg,#e5a00d,#8a5e00)"},
    {name:"Web",        mono:"@",  url:"https://www.google.com", sub:"Browse", grad:"linear-gradient(145deg,#394a7a,#1b2440)"}
  ];
  var BY = {}; for (var i=0;i<APPS.length;i++){ BY[APPS[i].name]=APPS[i]; }
  var RKEY = "tv-home-recent";

  function getRecents(){
    try { var r = JSON.parse(localStorage.getItem(RKEY) || "[]");
      var out=[]; for (var i=0;i<r.length;i++){ if (BY[r[i]]) out.push(r[i]); } return out;
    } catch(e){ return []; }
  }
  function pushRecent(name){
    try { var r=getRecents(); var out=[name];
      for (var i=0;i<r.length;i++){ if (r[i]!==name) out.push(r[i]); }
      localStorage.setItem(RKEY, JSON.stringify(out.slice(0,4)));
    } catch(e){}
  }

  var wrap = document.getElementById("wrap");
  var grid = document.getElementById("grid");
  var recentRow = document.getElementById("recentRow");
  var recentSec = document.getElementById("recentSec");
  var allLabel = document.getElementById("allLabel");
  var hl = document.getElementById("hl");
  var statusEl = document.getElementById("status");

  var tiles = [];   // DOM nodes in focus order: recents first, then grid
  var apps = [];    // matching app object per tile
  var focus = 0;
  var COLS = 4;
  var recentCount = 0;

  function makeTile(app, cls){
    var t = document.createElement("a");
    t.className = "tile" + (cls?(" "+cls):"");
    t.href = app.url;
    t.setAttribute("tabindex","-1");
    var card = document.createElement("div"); card.className="card";
    var brand = document.createElement("div"); brand.className="brand"; brand.style.background = app.grad;
    var glow = document.createElement("div"); glow.className="glow";
    var mono = document.createElement("div"); mono.className="mono"; mono.appendChild(document.createTextNode(app.mono));
    var name = document.createElement("div"); name.className="name"; name.appendChild(document.createTextNode(app.name));
    if (app.sub){ var s=document.createElement("span"); s.className="small"; s.appendChild(document.createTextNode(app.sub)); name.appendChild(s); }
    card.appendChild(brand); card.appendChild(glow); card.appendChild(mono); card.appendChild(name);
    t.appendChild(card);
    return t;
  }

  function build(){
    var recents = getRecents();
    recentCount = recents.length;
    tiles = []; apps = [];
    recentRow.innerHTML = ""; grid.innerHTML = "";

    if (recents.length){
      recentSec.style.display = ""; allLabel.style.display = "";
      for (var i=0;i<recents.length;i++){
        var a = BY[recents[i]];
        var t = makeTile(a, "recent");
        bindTile(t, tiles.length);
        recentRow.appendChild(t); tiles.push(t); apps.push(a);
      }
    } else {
      recentSec.style.display = "none"; allLabel.style.display = "none";
    }

    var used = {}; for (var j=0;j<recents.length;j++){ used[recents[j]]=1; }
    for (var k=0;k<APPS.length;k++){
      if (used[APPS[k].name]) continue;
      var tt = makeTile(APPS[k], null);
      bindTile(tt, tiles.length);
      grid.appendChild(tt); tiles.push(tt); apps.push(APPS[k]);
    }
    if (focus > tiles.length-1) focus = tiles.length-1;
    setFocus(focus, true);
  }

  function bindTile(t, index){
    t.onmouseover = function(){ setFocus(index, false); };
    t.onclick = function(e){ if(e&&e.preventDefault) e.preventDefault(); launch(index); return false; };
  }

  function setFocus(i, instant){
    if (i<0 || i>=tiles.length) return;
    if (tiles[focus]) tiles[focus].className = tiles[focus].className.replace(/ ?on/,"");
    focus = i;
    tiles[focus].className += " on";
    statusEl.innerHTML = ""; statusEl.appendChild(document.createTextNode(apps[focus].name));
    moveHighlight(instant);
  }

  function moveHighlight(instant){
    var el = tiles[focus]; if (!el) return;
    var card = el.getElementsByClassName("card")[0] || el;
    var r = card.getBoundingClientRect();
    var c = wrap.getBoundingClientRect();
    if (instant){ hl.style.webkitTransition="none"; hl.style.transition="none"; }
    hl.style.width = r.width + "px";
    hl.style.height = r.height + "px";
    var x = (r.left - c.left), y = (r.top - c.top);
    hl.style.webkitTransform = "translate("+x+"px,"+y+"px)";
    hl.style.transform = "translate("+x+"px,"+y+"px)";
    hl.style.opacity = "1";
    if (instant){
      // force reflow then restore transition
      void hl.offsetWidth;
      hl.style.webkitTransition=""; hl.style.transition="";
    }
  }

  function gridCols(){
    // number of grid tiles sharing the top row
    var start = recentCount;
    if (start >= tiles.length) return 1;
    var top = tiles[start].offsetTop, n = 0;
    for (var i=start;i<tiles.length;i++){ if (tiles[i].offsetTop === top) n++; else break; }
    return n || 1;
  }

  function launch(i){
    var a = apps[i]; if (!a) return;
    statusEl.innerHTML = ""; statusEl.appendChild(document.createTextNode("Opening "+a.name+"..."));
    pushRecent(a.name);
    window.location.href = a.url;
  }

  function toggleFull(){
    var d = document, el = d.documentElement;
    if (!d.fullscreenElement && !d.webkitFullscreenElement){
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (d.exitFullscreen) d.exitFullscreen();
      else if (d.webkitExitFullscreen) d.webkitExitFullscreen();
    }
  }

  document.onkeydown = function(e){
    var k = e.keyCode, n = tiles.length;
    COLS = gridCols();
    var R = recentCount, f = focus, nf = f, inRow = (R>0 && f<R);
    // 37 left,38 up,39 right,40 down,13 enter,32 space
    if (k===39){ nf = (f+1<n)?f+1:f; }
    else if (k===37){ nf = (f-1>=0)?f-1:0; }
    else if (k===40){
      if (inRow){ var col=f; if(col>COLS-1) col=COLS-1; nf = R+col; }
      else { nf = (f+COLS<n)?f+COLS:f; }
      if (nf>n-1) nf=n-1;
    }
    else if (k===38){
      if (!inRow){ var gi=f-R; if (gi<COLS){ nf = (R>0)?(gi<R?gi:R-1):f; } else { nf=f-COLS; } }
    }
    else if (k===13 || k===32){ if(e.preventDefault) e.preventDefault(); launch(f); return false; }
    else if (k===70){ toggleFull(); return; }
    else { return; }
    if(e.preventDefault) e.preventDefault();
    if (nf!==f) setFocus(nf, false);
    return false;
  };

  // clock + greeting
  function pad(x){ return x<10 ? "0"+x : ""+x; }
  var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function tick(){
    var now = new Date(), hh=now.getHours(), mm=now.getMinutes();
    var ap = hh<12?"AM":"PM", h12 = hh%12; if(h12===0) h12=12;
    document.getElementById("time").innerHTML = h12+":"+pad(mm)+'<span class="ap">'+ap+'</span>';
    document.getElementById("date").innerHTML = DAY[now.getDay()]+", "+MON[now.getMonth()]+" "+now.getDate();
    var g = hh<5?"Good night": hh<12?"Good morning": hh<17?"Good afternoon": hh<21?"Good evening":"Good night";
    document.getElementById("greet").innerHTML = g;
  }
  tick(); setInterval(tick, 10000);

  build();
  // re-measure after layout / fonts settle, and on resize / return
  setTimeout(function(){ moveHighlight(true); }, 300);
  setTimeout(function(){ moveHighlight(true); }, 900);
  window.onresize = function(){ moveHighlight(true); };
  if (window.addEventListener){ window.addEventListener("pageshow", function(){ build(); }, false); }
})();
</script>
</body>
</html>
